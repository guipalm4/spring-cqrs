name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build e testes (Testcontainers)
        run: ./mvnw -B -ntp verify

  compose:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        phase: [v1, v2]
    steps:
      - uses: actions/checkout@v7
      - name: Sobe a fase ${{ matrix.phase }}
        run: make up PHASE=${{ matrix.phase }}
      - name: Smoke test
        run: make smoke
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f infra/compose.yaml --profile ${{ matrix.phase }} logs
