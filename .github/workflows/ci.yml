name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # O MongoDB 8 se recusa a subir em kernels de 6.19 a 7.0.13 (SERVER-121912), e o ubuntu-latest (26.04) já está
    # nessa faixa. O 22.04 (kernel 6.8) mantém nos testes a mesma imagem do benchmark (mongo:8.0.34).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build e testes (Testcontainers)
        run: ./mvnw -B -ntp verify

  compose:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        phase: [v1, v1-replica, v2]
    steps:
      - uses: actions/checkout@v7
      - name: Sobe a fase ${{ matrix.phase }}
        run: make up PHASE=${{ matrix.phase }}
      - name: Smoke test
        run: make smoke PHASE=${{ matrix.phase }}
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f infra/compose.yaml --profile ${{ matrix.phase }} logs
