spring:
  application:
    name: app-baseline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      phase: v1
