# Controle da #11: pools separados para comandos e consultas, mesmo total de 10 conexões (ADR-0010).
# Divisão fixada antes de medir, a partir do uso de conexão dos comandos no M2; não se ajusta pelo resultado.
spring:
  datasource:
    hikari:
      pool-name: commands
      maximum-pool-size: 2

ledger:
  split-pools:
    queries:
      pool-name: queries
      maximum-pool-size: 8

management:
  metrics:
    tags:
      phase: v1-split
