spring:
  application:
    name: app-cqrs
  autoconfigure:
    # O Mongo só existe na query-api e no projetor da v3 (application-query.yaml, application-projector.yaml), que
    # esvaziam esta lista. Sem ela, a v2 e a command-api subiriam um cliente tentando conectar e um health DOWN.
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration
      - org.springframework.boot.mongodb.autoconfigure.metrics.MongoMetricsAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      # Explícito porque entra no benchmark: o mesmo tamanho de pool por instância em todas as fases (ADR-0009).
      maximum-pool-size: 10
  data:
    jdbc:
      # Fixo para o Spring Data JDBC não consultar o banco na partida (treino do AOT cache no Dockerfile).
      dialect: postgresql
  modulith:
    events:
      # Outbox da v3 (ADR-0004, ADR-0012): publicação enviada é apagada, então a tabela só guarda o que não saiu.
      completion-mode: delete
      jdbc:
        schema-initialization:
          # Esquema pelo Flyway (V3__event_publication.sql), como o resto do banco.
          enabled: false
      externalization:
        # Só a command-api envia ao Kafka (application-command.yaml). Na v2, o evento não sai do processo.
        enabled: false
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  tracing:
    sampling:
      # Nenhum span no benchmark; o profile trace (application-trace.yaml) liga 100% (ADR-0012).
      probability: 0.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  metrics:
    distribution:
      # Buckets de histograma: o Grafana calcula p95/p99 por endpoint com histogram_quantile.
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      phase: ${LEDGER_PHASE:v2}

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
