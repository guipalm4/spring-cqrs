spring:
  application:
    name: app-cqrs
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      # Explícito porque entra no benchmark: o mesmo tamanho de pool por instância em todas as fases (ADR-0009).
      maximum-pool-size: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  metrics:
    distribution:
      # Buckets de histograma: o Grafana calcula p95/p99 por endpoint com histogram_quantile.
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      phase: ${LEDGER_PHASE:v2}
