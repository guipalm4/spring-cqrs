global:
  scrape_interval: 5s

scrape_configs:
  # Só a aplicação da fase ativa responde; as demais aparecem como down.
  - job_name: ledger
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app-baseline:8080
          - app-baseline-split:8080
          - app-baseline-big:8080
          # v1-replica: as consultas, lendo da réplica (ADR-0013).
          - app-baseline-query:8080
          - app-cqrs:8080
          # v3: o rótulo instance separa as JVMs (comandos, consultas, projetor).
          - command-api:8080
          - query-api:8080
          - query-api-2:8080
          - projector:8080

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
