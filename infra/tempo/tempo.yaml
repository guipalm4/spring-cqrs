# Tempo local, só para o trace ponta a ponta da v3 (make up PHASE=v3 TRACE=1; ADR-0012). Nunca durante o benchmark.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
