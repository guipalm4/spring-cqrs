# Uso: make up PHASE=v1 (ou docker compose -f infra/compose.yaml --profile v1 up -d)
# PHASE=v1-split sobe o controle da #11: a mesma v1 com pools separados para comandos e consultas (ADR-0010).
# Profiles e limites de recursos: docs/adr/0007-ambiente-de-execucao.md

name: spring-cqrs

# Flags da JVM: entram no treino do AOT cache (build arg) e na execução (env) — o cache só vale com as mesmas.
# Sem MaxRAMPercentage a JVM usa 25% do container como heap (256 MB de 1 GB); ADR-0009.
x-jvm-opts: &jvm-opts "-XX:MaxRAMPercentage=75"

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/ledger
  DB_USER: ledger
  DB_PASSWORD: ledger
  JVM_OPTS: *jvm-opts

x-app-healthcheck: &app-healthcheck
  # A imagem JRE não tem curl; o bash abre a conexão HTTP direto.
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
  interval: 5s
  timeout: 3s
  retries: 24

services:
  postgres:
    image: postgres:18.6
    profiles: [v1, v1-split, v2, v3]
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    # Configuração dimensionada para o container (2 CPUs, 2 GB) e comum a todas as fases (ADR-0009).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - track_io_timing=on
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 2
    mem_limit: 2g

  app-baseline: &app-baseline
    build:
      context: ..
      args:
        MODULE: app-baseline
        JVM_OPTS: *jvm-opts
    image: spring-cqrs/app-baseline:local
    profiles: [v1]
    environment: *app-env
    ports: ["8080:8080"]
    healthcheck: *app-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 2
    mem_limit: 1g

  # Controle da #11: mesma imagem da v1, com um pool para comandos e outro para consultas (ADR-0010).
  app-baseline-split:
    <<: *app-baseline
    profiles: [v1-split]
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: split-pools

  app-cqrs:
    build:
      context: ..
      args:
        MODULE: app-cqrs
        JVM_OPTS: *jvm-opts
    image: spring-cqrs/app-cqrs:local
    profiles: [v2]
    environment:
      <<: *app-env
      LEDGER_PHASE: v2
    ports: ["8080:8080"]
    healthcheck: *app-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 2
    mem_limit: 1g

  # Métricas do Postgres para o Grafana (buffer hit ratio, conexões, locks); pg_stat_statements vem do make bench.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [v1, v1-split, v2, v3]
    environment:
      DATA_SOURCE_URI: postgres:5432/ledger?sslmode=disable
      DATA_SOURCE_USER: ledger
      DATA_SOURCE_PASS: ledger
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [v1, v1-split, v2, v3]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    cpus: 0.5
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [v1, v1-split, v2, v3]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    cpus: 0.5
    mem_limit: 512m

volumes:
  postgres-data:
