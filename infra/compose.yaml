# Uso: make up PHASE=v1 (ou docker compose -f infra/compose.yaml --profile v1 up -d)
# Profiles e limites de recursos: docs/adr/0007-ambiente-de-execucao.md

name: spring-cqrs

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/ledger
  DB_USER: ledger
  DB_PASSWORD: ledger

x-app-healthcheck: &app-healthcheck
  # A imagem JRE não tem curl; o bash abre a conexão HTTP direto.
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
  interval: 5s
  timeout: 3s
  retries: 24

services:
  postgres:
    image: postgres:18.6
    profiles: [v1, v2, v3]
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 2
    mem_limit: 2g

  app-baseline:
    build:
      context: ..
      args:
        MODULE: app-baseline
    image: spring-cqrs/app-baseline:local
    profiles: [v1]
    environment: *app-env
    ports: ["8080:8080"]
    healthcheck: *app-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 2
    mem_limit: 1g

  app-cqrs:
    build:
      context: ..
      args:
        MODULE: app-cqrs
    image: spring-cqrs/app-cqrs:local
    profiles: [v2]
    environment:
      <<: *app-env
      LEDGER_PHASE: v2
    ports: ["8080:8080"]
    healthcheck: *app-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 2
    mem_limit: 1g

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [v1, v2, v3]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    cpus: 0.5
    mem_limit: 512m

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [v1, v2, v3]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    cpus: 0.5
    mem_limit: 512m

volumes:
  postgres-data:
